<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CA Performance</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }
    header {
      background: #d00000;
      padding: 25px;
    }
    h1 { margin: 0; }
    .container { padding: 20px; }
    .card {
      background: #222;
      margin: 15px 0;
      padding: 20px;
      border-radius: 12px;
    }
    button {
      background: #d00000;
      color: white;
      border: 0;
      padding: 14px 22px;
      border-radius: 8px;
      font-size: 17px;
    }
  </style>
</head>
<body>

<header>
  <h1>CA Performance</h1>
  <p>Entrena tu vida</p>
</header>

<div class="container">
  <div class="card">
    <h2>30 Minutos Activos</h2>
    <p>Programa de entrenamiento de 4 semanas</p>
    <button>Comenzar</button>
  </div>

  <div class="card">
    <h2>Entrenamientos</h2>
    <p>Principiante · Intermedio · Avanzado</p>
  </div>

  <div class="card">
    <h2>Videos</h2>
    <p>Aprende la técnica correcta de cada ejercicio.</p>
  </div>

  <div class="card">
    <h2>Mi progreso</h2>
    <p>Registra y revisa tu avance.</p>
  </div>
</div>

</body>
</html>
